name: Nazdak CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Kodu Repodan Çek (Checkout)
      uses: actions/checkout@v4

    - name: Node.js 20 Ortamını Kur
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'

    - name: API Bağımlılıklarını Yükle
      working-directory: ./apps/api
      run: npm install

    - name: API'yi Derle (Build)
      working-directory: ./apps/api
      run: npm run build --if-present

    # İleride test yazarsan başındaki diyezleri kaldırıp aktif edebilirsin:
    # - name: Testleri Çalıştır
    #   working-directory: ./apps/api
    #   run: npm test